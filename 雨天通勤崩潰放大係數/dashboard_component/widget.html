<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>捷運最後一哩服務健康度組件</title>
  <link rel="stylesheet" href="widget.css">
</head>
<body>
  <article class="last-mile-widget">
    <header>
      <div>
        <p>Metro Last-mile Service Health</p>
        <h1>捷運最後一哩服務健康度</h1>
      </div>
      <strong id="metricValue">--</strong>
    </header>

    <section class="summary-grid">
      <div><span>弱服務站點</span><b id="pressureValue">--</b></div>
      <div><span>觀測站點</span><b id="baselineValue">--</b></div>
      <div><span>歷史快照</span><b id="historyValue">--</b></div>
      <div><span>更新時間</span><b id="updateValue">--</b></div>
    </section>

    <section class="content-grid">
      <div class="network-panel">
        <svg id="networkSvg" viewBox="0 0 900 560" role="img" aria-label="雙北捷運最後一哩服務健康度"></svg>
      </div>
      <ol id="rankList" class="rank-list"></ol>
    </section>

    <footer id="methodText"></footer>
  </article>
  <div id="tooltip" class="tooltip"></div>
  <script src="widget.js"></script>
</body>
</html>
